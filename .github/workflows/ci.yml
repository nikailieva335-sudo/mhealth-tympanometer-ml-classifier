name: Simulation to Test The ML Models

on:
  push:
  pull_request:

env:
  ZEPHYR_SDK_VERSION: "0.16.8"
  SDK_ROOT: "${{ github.workspace }}/zephyr-sdk"

jobs:
  test_classifier:
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci-base:v0.28.8
    strategy:
      matrix:
        MODEL_VERSION: ["v1", "v2", "v3", "v4", "v5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Zephyr SDK and workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr-sdk/
            zephyr/
            modules/
            bootloader/
            .west/
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ hashFiles('application/west.yml') }}

      - name: Install Zephyr SDK
        run: |
          SDK_DIR="$SDK_ROOT/zephyr-sdk-$ZEPHYR_SDK_VERSION"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_ROOT"
            cd "$SDK_ROOT"
            TARBALL="zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
            wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/${TARBALL}"
            tar xf "$TARBALL"
            rm "$TARBALL"
            cd "zephyr-sdk-$ZEPHYR_SDK_VERSION"
            ./setup.sh -t arm-zephyr-eabi -h -c
            cd "$GITHUB_WORKSPACE"
          fi
          echo "ZEPHYR_SDK_INSTALL_DIR=$SDK_ROOT/zephyr-sdk-$ZEPHYR_SDK_VERSION" >> $GITHUB_ENV

      - name: Initialize west workspace
        run: |
          if [ ! -f .west/config ]; then
            west init -l application
          fi
          west update --narrow -o=--depth=1
          west zephyr-export
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> $GITHUB_ENV

      - name: Build native simulator
        run: |
          west build -p always -b native_sim/native -d application/build application -- \
            -DMODEL=${{ matrix.MODEL_VERSION }} \
            -DMODEL_VERSION=${{ matrix.MODEL_VERSION }} \
            -DNCS_TOOLCHAIN_VERSION=NONE

      - name: Run classifier test
        working-directory: application
        run: |
          chmod 755 build/zephyr/zephyr.exe
          build/zephyr/zephyr.exe -stop_at=0 | tee ../sim_out_${{ matrix.MODEL_VERSION }}
          if grep -q ERROR ../sim_out_${{ matrix.MODEL_VERSION }}; then
            echo "FAILED: ERROR found in model ${{ matrix.MODEL_VERSION }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-exe-${{ matrix.MODEL_VERSION }}
          path: application/build/zephyr/zephyr.exe

  build_nrf52833dk:
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci-base:v0.28.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Zephyr SDK and workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr-sdk/
            zephyr/
            modules/
            bootloader/
            .west/
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ hashFiles('application/west.yml') }}

      - name: Install Zephyr SDK
        run: |
          SDK_DIR="$SDK_ROOT/zephyr-sdk-$ZEPHYR_SDK_VERSION"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$SDK_ROOT"
            cd "$SDK_ROOT"
            TARBALL="zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
            wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/${TARBALL}"
            tar xf "$TARBALL"
            rm "$TARBALL"
            cd "zephyr-sdk-$ZEPHYR_SDK_VERSION"
            ./setup.sh -t arm-zephyr-eabi -h -c
            cd "$GITHUB_WORKSPACE"
          fi
          echo "ZEPHYR_SDK_INSTALL_DIR=$SDK_ROOT/zephyr-sdk-$ZEPHYR_SDK_VERSION" >> $GITHUB_ENV

      - name: Initialize west workspace
        run: |
          if [ ! -f .west/config ]; then
            west init -l application
          fi
          west update --narrow -o=--depth=1
          west zephyr-export
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> $GITHUB_ENV

      - name: Build nrf52833dk
        run: |
          west build -p always -b nrf52833dk/nrf52833 -d application/build application -- \
            -DMODEL=v1 \
            -DMODEL_VERSION=v1 \
            -DNCS_TOOLCHAIN_VERSION=NONE